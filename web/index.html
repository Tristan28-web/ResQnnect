<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GIS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GIS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-signin-client_id" content="1018814514644-325uuvmqveq2f5o646h4d8in9kbqa2lh.apps.googleusercontent.com">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDScomUWZR0uMzReCG_t75caWDj4NgUdD4"></script>

  <!-- Hide native Google Maps UI controls (pan arrows, zoom +/-, tilt, pegman) -->
  <style>
    /* Pan control arrows */
    .gm-bundled-control { display: none !important; }
    /* Zoom control +/- */
    .gm-control-active[aria-label*="Zoom"] { display: none !important; }
    /* Tilt & rotate controls */
    .gm-svpc { display: none !important; }
    /* Fullscreen button */
    .gm-fullscreen-control { display: none !important; }
    /* Compass / rotate widget */
    .gm-compass { display: none !important; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
